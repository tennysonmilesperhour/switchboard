name: Deploy database migrations

# Applies any new supabase/migrations/*.sql to the production database on every
# push to main, so schema changes go live automatically with the code that needs
# them. It is a no-op until the three repository secrets below are set, so
# merging this workflow changes nothing until you opt in.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — your project ref (e.g. cuzgighqdzypntmhxrqc,
#                            the subdomain of your project URL)
#   SUPABASE_DB_PASSWORD   — the database password
#                            (Project Settings → Database → Connection info)

on:
  push:
    branches: [main]

jobs:
  db-push:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase deploy secrets not configured — skipping migration push."
            echo "Set SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, and SUPABASE_DB_PASSWORD to enable."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
