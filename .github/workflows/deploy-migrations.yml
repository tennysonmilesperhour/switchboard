name: Deploy database migrations

# Applies any new supabase/migrations/*.sql to the production database on every
# push to main, so schema changes go live automatically with the code that needs
# them.
#
# This job FAILS CLOSED: if the deploy secrets below are absent it errors
# (rather than silently passing), so a merge can never report a green deployment
# while leaving the database behind. Configure the secrets to make it pass.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — your project ref (e.g. cuzgighqdzypntmhxrqc,
#                            the subdomain of your project URL)
#   VERCEL_DEPLOY_HOOK_URL — a production deploy hook for the main branch;
#                            treat it as a secret because anyone holding it can
#                            trigger a deployment
#
# Supabase CLI 2.109.1 obtains a temporary database login through the Management
# API, so no long-lived database password is stored in GitHub.

on:
  push:
    branches: [main]

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  db-push:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight — require deploy secrets (fail closed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$VERCEL_DEPLOY_HOOK_URL" ] && missing="$missing VERCEL_DEPLOY_HOOK_URL"
          if [ -n "$missing" ]; then
            echo "::error::Production deploy secrets are not configured:$missing"
            echo "Set them in repo Settings → Secrets and variables → Actions."
            echo "Until then this job fails before changing the database or deploying the app."
            exit 1
          fi
          echo "All production deploy secrets are present."

      # Pinned rather than 'latest' so local and CI behave identically. Bump
      # deliberately alongside a documented local upgrade.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          # --include-all: apply pending migrations whose timestamp sorts BEFORE
          # the last one already applied.
          #
          # Without it, `db push` refuses the moment two branches merge out of
          # timestamp order — which is not an edge case, it is what happens
          # whenever two PRs are open at once. #150 (20260819120000) merged
          # first and deployed; #148, branched earlier, then merged with five
          # 20260818* migrations that now sorted before it, and the deploy
          # failed with "Found local migration files to be inserted before the
          # last migration on remote database". Nothing was applied, so main was
          # green while production was missing six migrations and the settings
          # page was reading columns that did not exist there.
          #
          # The guard this drops is "a migration authored on a stale branch
          # could apply after newer ones". That is worth knowing about, but it
          # is not worth a failed deploy every time two branches are in flight,
          # and it is not the check that would catch a genuinely incompatible
          # migration — the pgTAP suite and the parity step below are. Ordering
          # between independent migrations is not something the timestamp can
          # promise anyway; only the migrations' own dependencies can.
          supabase db push --include-all

      - name: Verify schema parity (no migration left pending)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # After a successful push nothing should remain to apply. `db push
          # --dry-run` prints the pending list (empty when in parity). Treat any
          # listed local migration version as drift.
          if ! out="$(supabase db push --dry-run 2>&1)"; then
            echo "$out"
            echo "::error::Schema parity could not be verified. Production deployment is blocked."
            exit 1
          fi
          echo "$out"
          if echo "$out" | grep -qE '^[[:space:]]*[0-9]{14}_'; then
            echo "::error::Migrations still pending after push — production is not at schema parity."
            exit 1
          fi
          echo "Production is at schema parity with the repository."

      - name: Trigger production deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL")"; then
            cat "$response_file"
            echo "::error::Vercel deploy hook request failed."
            exit 1
          fi

          cat "$response_file"
          case "$http_status" in
            200|201|202) ;;
            *)
              echo "::error::Vercel deploy hook returned HTTP $http_status."
              exit 1
              ;;
          esac

          job_id="$(jq -r '.job.id // empty' "$response_file")"
          if [ -z "$job_id" ]; then
            echo "::error::Vercel accepted the request without returning a deployment job id."
            exit 1
          fi
          echo "Triggered Vercel production deployment job $job_id after schema parity passed."
