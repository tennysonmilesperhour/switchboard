name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel older PR runs when a newer commit needs testing. Each main or manual
# run has its own group, so verifying a merged tree cannot cancel another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CI helpers
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure space for browser tests
        run: bash scripts/ci/ensure-disk-space.sh 8

      # Only the engines playwright.config.ts actually drives: chromium for the
      # desktop project, webkit for the mobile (iPhone) one. `install` with no
      # arguments also pulls Firefox, which nothing here runs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # This job deliberately has no Supabase or app-origin env: the smoke suite
      # is the "deployment is half-configured" case, and the dev server's
      # fallbacks are what it asserts against. It therefore stays on `next dev`
      # (and keeps the clean, so dev doesn't read the production build) while
      # the authenticated job — which has the full env — runs the real build.
      - name: Clean build output before smoke test
        run: rm -rf .next

      - name: Smoke test
        run: npx playwright test

  authenticated-e2e:
    name: Authenticated E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Test-only values for the throwaway local stack, not secrets. Job-level so
    # the build, the `npm run start` server Playwright launches and the specs
    # all read the same ones. CRON_SECRET lets the plan-lifecycle journeys run
    # the minute sweep on demand; the RESEND_* trio sends the app's mail to the
    # loopback relay Playwright starts (e2e/mail-relay.ts), which hands it to
    # the local Mailpit, so sign-up and recovery links can be opened.
    env:
      CRON_SECRET: e2e-local-cron-secret
      RESEND_API_KEY: e2e-local-relay
      EMAIL_FROM: Switchboard E2E <e2e@switchboard.test>
      RESEND_API_URL: http://127.0.0.1:54380/emails

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      # Make room before pulling database images, not after the stack and app
      # have already consumed the runner's disk.
      - name: Ensure space for database and browser tests
        run: bash scripts/ci/ensure-disk-space.sh 12

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.116.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write a minimal local Supabase config
        run: |
          [ -f supabase/config.toml ] || printf 'project_id = "switchboard"\n' > supabase/config.toml

      - name: Log in to ghcr.io
        # Anonymous pulls from ghcr.io share a rate limit with every other
        # anonymous runner, and that limit refused postgres and realtime for
        # seven minutes straight. The job token's packages:read is enough to
        # pull Supabase's public images as an authenticated client.
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase
        run: node scripts/ci/start-supabase.mjs

      # Run against the same fresh migrations and seed as the browser tests.
      # pgTAP tests roll back their transactions, before E2E fixtures are added.
      - name: Run pgTAP security tests
        run: supabase test db

      - name: Verify generated database types
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"

      - name: Export local Supabase env
        run: |
          # `supabase status -o env` emits shell-quoted values
          # (KEY="value"). $GITHUB_ENV does not interpret shell quoting, so the
          # quotes would be captured literally and later break consumers like
          # @supabase/supabase-js (Invalid supabaseUrl). Strip a matched pair of
          # surrounding double quotes before appending.
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "E2E_DB=1" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"

      - name: Verify account export and complete deletion
        run: npx vitest run src/lib/server/account-data.integration.test.ts

      - name: Seed authenticated E2E fixtures
        run: node e2e/seed.mjs

      # After the Supabase env is exported, so the client bundle is built
      # against the same project the tests run against.
      - name: Build
        run: npm run build

      - name: Ensure remaining space for browser tests
        run: bash scripts/ci/ensure-disk-space.sh 8

      # This job is the desktop authenticated contract; the verify job above
      # already runs the public smoke contract against both desktop and mobile.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run authenticated journey tests
        run: npx playwright test --project=desktop e2e/authed.spec.ts e2e/invite-links.spec.ts e2e/client-signoff.spec.ts e2e/places.spec.ts e2e/accounts.spec.ts e2e/plan-lifecycle.spec.ts e2e/safety.spec.ts e2e/rooms.spec.ts e2e/people-places.spec.ts e2e/plans-more.spec.ts e2e/settings.spec.ts
        env:
          PLAYWRIGHT_WEB_SERVER: npm run start

      # Playwright writes an accessibility snapshot of the page it gave up on,
      # and then mentions only its *path* — so the one artifact that says what
      # was actually on screen is readable exclusively by someone who can
      # download the zip. Egress policy, an expired link, or simply reading the
      # run from a phone all defeat that. Print it, so the log alone answers
      # "what did the app show?".
      #
      # Only the snapshot: Playwright also writes the failing spec's source into
      # this file, and printing the whole thing pushed the assertion message —
      # the part that says what went wrong — off the end of a `tail`. Evidence
      # that buries the verdict is not evidence.
      - name: Show what was on the screen
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for context in test-results/*/error-context.md; do
            found=1
            echo "::group::$context"
            awk '/^# Page snapshot/,0' "$context" | head -c 4000
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No error-context.md was written — the failure was not a page assertion."

      # A failing browser journey with nothing kept is a failure nobody can
      # diagnose: this suite stayed red for two weeks because the only evidence
      # was one assertion message, and answering "what did the app actually
      # show?" needed a database no reviewer had. Keep the report, the traces,
      # and the per-test error context whenever it goes red.
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authed-e2e-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      # Last, so it is the last thing in the log.
      #
      # Everything above this — the snapshot, the artifact upload, the runner's
      # cleanup — sits between a failure and the end of the job, so reading a red
      # run meant paging back through hundreds of lines for the one sentence that
      # says what broke. Three separate investigations here started that way.
      # Whatever else the log holds, it now ends with the verdict.
      - name: What failed, in one place
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const path = "playwright-report/results.json";
            if (!fs.existsSync(path)) {
              console.log("No JSON report — the run failed before any test reported.");
              process.exit(0);
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const failures = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  for (const run of test.results ?? []) {
                    if (run.status === "passed" || run.status === "skipped") continue;
                    failures.push([spec.title, (run.error?.message ?? "(no message)")]);
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            if (!failures.length) {
              console.log("The JSON report lists no failing test — the job failed outside the suite.");
              process.exit(0);
            }
            for (const [title, message] of failures) {
              console.log("\n=== " + title + " ===");
              console.log(message.replace(/\x1b\[[0-9;]*m/g, "").trim());
            }
          '
