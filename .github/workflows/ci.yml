name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The runner ships with toolchains this project never uses (dotnet, the
      # Android SDK, GHC). Playwright's browsers plus a Next build were tipping
      # the disk to 0 MB free mid-run, which surfaces as unrelated test
      # failures rather than as a disk error.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Only the engines playwright.config.ts actually drives: chromium for the
      # desktop project, webkit for the mobile (iPhone) one. `install` with no
      # arguments also pulls Firefox, which nothing here runs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # This job deliberately has no Supabase or app-origin env: the smoke suite
      # is the "deployment is half-configured" case, and the dev server's
      # fallbacks are what it asserts against. It therefore stays on `next dev`
      # (and keeps the clean, so dev doesn't read the production build) while
      # the authenticated job — which has the full env — runs the real build.
      - name: Clean build output before smoke test
        run: rm -rf .next

      - name: Smoke test
        run: npx playwright test

  authenticated-e2e:
    name: Authenticated E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write a minimal local Supabase config
        run: |
          [ -f supabase/config.toml ] || printf 'project_id = "switchboard"\n' > supabase/config.toml

      - name: Start local Supabase
        run: supabase start

      - name: Verify generated database types
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"

      - name: Export local Supabase env
        run: |
          # `supabase status -o env` emits shell-quoted values
          # (KEY="value"). $GITHUB_ENV does not interpret shell quoting, so the
          # quotes would be captured literally and later break consumers like
          # @supabase/supabase-js (Invalid supabaseUrl). Strip a matched pair of
          # surrounding double quotes before appending.
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "E2E_DB=1" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"

      - name: Seed authenticated E2E fixtures
        run: node e2e/seed.mjs

      # After the Supabase env is exported, so the client bundle is built
      # against the same project the tests run against.
      - name: Build
        run: npm run build

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Only chromium: authed.spec.ts skips the mobile project outright.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run authenticated journey tests
        run: npx playwright test e2e/authed.spec.ts
        env:
          PLAYWRIGHT_WEB_SERVER: npm run start

      # Playwright writes an accessibility snapshot of the page it gave up on,
      # and then mentions only its *path* — so the one artifact that says what
      # was actually on screen is readable exclusively by someone who can
      # download the zip. Egress policy, an expired link, or simply reading the
      # run from a phone all defeat that. Print it, so the log alone answers
      # "what did the app show?".
      #
      # Only the snapshot: Playwright also writes the failing spec's source into
      # this file, and printing the whole thing pushed the assertion message —
      # the part that says what went wrong — off the end of a `tail`. Evidence
      # that buries the verdict is not evidence.
      - name: Show what was on the screen
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for context in test-results/*/error-context.md; do
            found=1
            echo "::group::$context"
            awk '/^# Page snapshot/,0' "$context" | head -c 4000
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No error-context.md was written — the failure was not a page assertion."

      # A failing browser journey with nothing kept is a failure nobody can
      # diagnose: this suite stayed red for two weeks because the only evidence
      # was one assertion message, and answering "what did the app actually
      # show?" needed a database no reviewer had. Keep the report, the traces,
      # and the per-test error context whenever it goes red.
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authed-e2e-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      # Last, so it is the last thing in the log.
      #
      # Everything above this — the snapshot, the artifact upload, the runner's
      # cleanup — sits between a failure and the end of the job, so reading a red
      # run meant paging back through hundreds of lines for the one sentence that
      # says what broke. Three separate investigations here started that way.
      # Whatever else the log holds, it now ends with the verdict.
      - name: What failed, in one place
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const path = "playwright-report/results.json";
            if (!fs.existsSync(path)) {
              console.log("No JSON report — the run failed before any test reported.");
              process.exit(0);
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const failures = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  for (const run of test.results ?? []) {
                    if (run.status === "passed" || run.status === "skipped") continue;
                    failures.push([spec.title, (run.error?.message ?? "(no message)")]);
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            if (!failures.length) {
              console.log("The JSON report lists no failing test — the job failed outside the suite.");
              process.exit(0);
            }
            for (const [title, message] of failures) {
              console.log("\n=== " + title + " ===");
              console.log(message.replace(/\x1b\[[0-9;]*m/g, "").trim());
            }
          '
