name: Database tests

# Runs the pgTAP security-invariant tests (supabase/tests/*.test.sql) against a
# real local Supabase stack, so the RLS + security-definer guarantees the app
# depends on can't silently regress in a migration. The app-level CI (ci.yml)
# covers lint/unit/build/e2e; this is the database's own test suite.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Only when the schema, its tests, or this workflow change — booting the
      # Supabase stack is heavy, so skip it for pure app-code PRs.
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  pgtap:
    name: pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`): resolving "latest" makes an unauthenticated
          # GitHub API call that gets rate-limited on shared runners. A pinned
          # version downloads directly and is reproducible.
          version: 2.109.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write a minimal local config
        # config.toml isn't committed (it's local-dev scaffolding); a bare
        # project_id is enough — the CLI fills every other setting with defaults.
        run: |
          [ -f supabase/config.toml ] || printf 'project_id = "switchboard"\n' > supabase/config.toml

      - name: Start local stack (applies all migrations)
        # ghcr.io rate-limits image pulls (toomanyrequests) when several runs
        # start at once, and one refused pull fails the whole start. Images
        # that did land stay cached, so each retry has less to fetch. The
        # excluded services (dashboard, log pipeline, image resizer, edge
        # functions) are never touched by these tests: five fewer pulls to lose.
        run: |
          for attempt in 1 2 3 4; do
            if supabase start -x studio,logflare,vector,imgproxy,edge-runtime; then
              exit 0
            fi
            supabase stop --no-backup || true
            [ "$attempt" = 4 ] && break
            delay=$(( attempt * 45 + RANDOM % 30 ))
            echo "::warning::supabase start failed (attempt $attempt); retrying in ${delay}s"
            sleep "$delay"
          done
          exit 1

      - name: Run pgTAP security tests
        run: supabase test db
